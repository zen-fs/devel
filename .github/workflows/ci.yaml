name: CI

on:
    push:
        branches:
            - main
    workflow_dispatch:
    workflow_call:
    pull_request:

jobs:
    ci:
        name: Continuous Integration
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: latest

            - name: Install dependencies
              run: npm ci

            - name: Formatting
              run: npm run format:check

            - name: Linting
              run: npm run lint

            - name: SPDX License Check
              run: npm run spdx:check

            - name: 'Unit tests: InMemory'
              run: npx zenfs-test -pvn tests/setup/memory.ts

            - name: Report coverage
              run: npx zenfs-test --report-only
