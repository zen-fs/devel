name: CI

on:
    push:
        branches:
            - main
    workflow_dispatch:
    workflow_call:
    pull_request:

jobs:
    ci:
        name: Continuous Integration
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: latest

            - name: Install dependencies
              run: npm ci

            - name: Check out @zenfs/core
              uses: actions/checkout@v5
              with:
                  repository: zen-fs/core
                  path: core

            - name: Link @zenfs/core
              run: |
                  mv core ../core
                  cd ../core
                  npm install
                  npm run build
                  cd -
                  npm i --no-save ../core

            - name: Formatting
              run: npm run format:check

            - name: Build
              run: npm run build

            - name: Linting
              run: npm run lint

            - name: SPDX License Check
              run: npm run spdx:check

            - name: 'Unit tests: InMemory'
              run: node dist/bin/zenfs-test.js -pv dist/tests/setup/memory.js

            - name: Report coverage
              run: node dist/bin/zenfs-test.js --report-only
